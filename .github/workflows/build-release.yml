name: Build Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSYS2 MinGW64 环境（gcc + windres），与本机 w64devkit 编译参数保持一致
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Build release
        shell: msys2 {0}
        run: ./tools/build_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOptimizer-release
          path: |
            release/GameOptimizer-portable.zip
            release/GameOptimizer-setup.exe

      # 打 v* tag 时自动创建 GitHub Release 并附带安装包
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/GameOptimizer-portable.zip
            release/GameOptimizer-setup.exe
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## GameOptimizer v${{ github.ref_name }}

            **所有功能免费** · 硬件无感 · 一键安全回滚 · 中英双语 · MIT 开源

            - **一键性能优化**：无需先启动游戏（自动检测游戏 / 系统级优化）
            - **8 款游戏**：三角洲行动、英雄联盟、CS2、绝地求生、无畏契约、Apex Legends、Dota 2、守望先锋2
            - **每款游戏「优化启动」配置**：exe 路径 / 启动参数 / 电源等开关
            - **安全**：仅官方 WinAPI，无注入、无内核 Hook，适合带反作弊游戏
            - **现代化主题 GUI** + 完整 CLI

            ### 下载
            - `GameOptimizer-setup.exe`：安装包（GUI + CLI + 自检）
            - `GameOptimizer-portable.zip`：免安装便携版
