# [[game.rules]]
# id = "priority"
# action = { priority = { class = "above-normal" } }
#
# [[game.rules]]
# id = "affinity"
# action = { affinity = { reserve_cores = 4 } }

# =============================================================================
# 示例 B：显式掩码（与 reserve_cores 二选一，只能用在处理器组 0）
# 掩码按"组内第 i 个逻辑处理器 = 第 i 位"，接受十进制整数或 "0x..." 十六进制字符串。
# =============================================================================
# [[game.rules]]
# id = "affinity-mask"
# action = { affinity = { mask = "0x0000ffff" } }
